<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="pricing-plan">
            <h2 class="type">Basic</h2>
            <div id="price">
                <h1 class="price">10$</h1>
                <p class="time">/month</p>
            </div>
            <hr>
            <div class="benefits">
                <ul>
                    <li>5GB storage</li>
                    <li>Basic support</li>
                    <li>1 Project</li>
                </ul>
            </div>
            <div class="start">
                <p class="get">Get started</p>
            </div>
        </div>
        <div class="pricing-plan">
            <h2 class="type">Standard</h2>
            <div id="price">
                <h1 class="price">25$</h1>
                <p class="time">/month</p>
            </div>
            <hr>
            <div class="benefits">
                <ul>
                    <li>20GB storage</li>
                    <li>fast support</li>
                    <li>5 Projects</li>
                </ul>
            </div>
            <div class="start">
                <p class="get">Get started</p>
            </div>
        </div><div class="pricing-plan">
            <h2 class="type">Premium</h2>
            <div id="price">
                <h1 class="price">50$</h1>
                <p class="time">/month</p>
            </div>
            <hr>
            <div class="benefits">
                <ul>
                    <li>100GB storage</li>
                    <li>Priority support</li>
                    <li>Unlimited Projects</li>
                </ul>
            </div>
            <div class="start">
                <p class="get">Get started</p>
            </div>
        </div>
    </div>
</body>

</html>
