<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="pricing-plan">
            <h2 class="type" dir="auto">Basic</h2>
            <div id="price">
                <h1 class="price" dir="auto">10$</h1>
                <p class="time" dir="auto">/month</p>
            </div>
            <hr>
            <div class="benefits">
                <ul>
                    <li dir="auto">5GB storage</li>
                    <li dir="auto">Basic support</li>
                    <li dir="auto">1 Project</li>
                </ul>
            </div>
            <div class="start">
                <p class="get" dir="auto">Get started</p>
            </div>
        </div>
        <div class="pricing-plan">
            <h2 class="type" dir="auto">Standard</h2>
            <div id="price">
                <h1 class="price" dir="auto">25$</h1>
                <p class="time" dir="auto">/month</p>
            </div>
            <hr>
            <div class="benefits">
                <ul>
                    <li dir="auto">20GB storage</li>
                    <li dir="auto">fast support</li>
                    <li dir="auto">5 Projects</li>
                </ul>
            </div>
            <div class="start">
                <p class="get" dir="auto">Get started</p>
            </div>
        </div><div class="pricing-plan">
            <h2 class="type" dir="auto">Premium</h2>
            <div id="price">
                <h1 class="price" dir="auto">50$</h1>
                <p class="time" dir="auto">/month</p>
            </div>
            <hr>
            <div class="benefits">
                <ul>
                    <li dir="auto">100GB storage</li>
                    <li dir="auto">Priority support</li>
                    <li dir="auto">Unlimited Projects</li>
                </ul>
            </div>
            <div class="start">
                <p class="get" dir="auto">Get started</p>
            </div>
        </div>
    </div>
</body>

</html>
